name: Build MOHSEN SCOUT APK

on:
  workflow_dispatch:
  push:
    branches: [ci/apk-build]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Apply React Native WebView Android Gradle compatibility fix
        shell: bash
        run: |
          FILE="node_modules/react-native-webview/android/build.gradle"
          if grep -q 'com.android.tools.build:gradle:7.0.4' "$FILE"; then
            sed -i 's/com.android.tools.build:gradle:7.0.4/com.android.tools.build:gradle:9.2.1/' "$FILE"
          fi
          grep -n 'com.android.tools.build:gradle' "$FILE"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mohsen-scout-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
